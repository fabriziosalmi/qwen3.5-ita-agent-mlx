    ordered: true
    calls:
      - {tool: read_text_file, args: {path: {path: /home/utente/documenti/fattura-2026-10.txt}}}
      - {tool: calcola_iva, args: {importo: {num: 1250}}}
    answer: {any: [["corrett", "giust", "torna", "esatt"]], not: [sbagliat, errat]}

- id: dev-chain-ombrello
  category: chain
  envs: [web, notes]
  turns:
    - "Se giovedì a Genova piove, segnati di portare l'ombrello."
  checks:
