# Dev split, batch 2. Written by hand. Oracle values computed with qita/envs code
# (working days of December 2026: 21; 2026-11-04..30: 19, from 2026-11-05: 18;
# calendar days 2026-11-04 -> 2026-11-30: 26; Q3 revenue by month 3210 / 1965 / 4980).

# ---------------- single ----------------

- id: dev-single-elenca-foto
  category: single
  envs: [files]
  turns:
    - "Che foto ho nella cartella foto?"
  checks:
    calls: [{tool: list_directory, args: {path: {path: /home/utente/foto}}}]
    answer: {any: [["cinque terre", "cinque-terre"]], contains: [carta]}

- id: dev-single-agenda-domani
  category: single
  envs: [calendar]
  turns:
    - "Cosa ho in agenda domani?"
  checks:
    calls: [{tool: list_events, args: {start_date: {date: "2026-11-05"}}}]
    answer: {contains: [palestra]}

- id: dev-single-lavorativi-dicembre
  category: single
  envs: [itcalc]
  turns:
    - "Quanti giorni lavorativi ci sono a dicembre 2026?"
  checks:
    calls: [{tool: giorni_lavorativi, args: {inizio: {date: "2026-12-01"}, fine: {date: "2026-12-31"}}}]
    answer: {contains: ["21"]}

- id: dev-single-note-libri
  category: single
  envs: [notes]
  turns:
    - "Quali libri mi ero segnato da leggere?"
  checks:
    answer: {contains: [città invisibili, lessico famigliare]}

- id: dev-single-righe-log
  category: single
  envs: [shell]
  turns:
    - "Quante righe ha il log del backup?"
  checks:
    calls: [{tool: esegui_comando, args: {comando: {contains: backup.log}}}]
    answer: {contains: ["14"]}

- id: dev-single-cena-luca
  category: single
  envs: [calendar]
  turns:
    - "Mettimi in calendario la cena con Luca venerdì alle 20:30, per due ore."
  checks:
    calls: [{tool: create_event, args: {start: {date: "2026-11-06T20:30"}, end: {date: "2026-11-06T22:30"}}}]
    state: [{kind: event_exists, title_contains: luca, start: "2026-11-06T20:30"}]

# ---------------- chain ----------------

- id: dev-chain-incasso-settembre
  category: chain
  envs: [files]
