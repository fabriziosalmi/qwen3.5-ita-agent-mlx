    ordered: true
    calls:
      - {tool: read_text_file, args: {path: {path: /home/utente/note/riunione-2026-11-03.md}}}
      - {tool: list_events}
    answer: {any: [["6 novembre", "06/11", "2026-11-06"], ["sì", "9:30", "09:30"]]}

- id: dev-chain-porta-app
