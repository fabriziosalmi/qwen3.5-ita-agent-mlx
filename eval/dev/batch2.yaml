- id: dev-chain-ultimo-backup
  category: chain
  envs: [shell]
  turns:
    - "Qual è stato l'ultimo backup riuscito e quanti file ha salvato?"
  checks:
    calls: [{tool: esegui_comando, args: {comando: {contains: backup.log}}}]
    answer: {contains: ["18.262"], any: [["3 novembre", "2026-11-03", "03/11"]]}

