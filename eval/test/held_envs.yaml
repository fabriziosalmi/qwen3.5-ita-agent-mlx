  category: choice
  envs: [git, shell]
  turns: ["Qual è il messaggio dell'ultimo commit nel repo ~/progetti/sito?"]
  checks:
    calls: [{tool: git_log}]
    answer: {contains: [chi siamo]}

- id: t-choice-rinnova-non-emetti
  category: choice
  envs: [certs]
