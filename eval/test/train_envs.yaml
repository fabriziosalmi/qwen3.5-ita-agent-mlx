# Test split, part 2: new requests on the train envs (same eval-only fixture world as dev).
# Frozen once its SHA-256 is in docs/LEDGER.md. Never training data, never a tuning signal.
# Oracles from qita/envs code: November 2026 has 21 working days, December 21;
# 2026-11-04..20: 13 (12 from 2026-11-05); 2026-11-05..30: 18; 10 working days after
# 2026-11-04: 2026-11-18; tickets sold in Q3: 435; RSSMRA85T10A562 check char S.

# ---------------- single ----------------

- id: t-single-deposito
  category: single
  envs: [files]
  turns: ["Quanto ho versato di deposito cauzionale per l'affitto?"]
  checks:
    answer: {any: [["2.340", "2340"]]}

- id: t-single-sabato
  category: single
  envs: [calendar]
  turns: ["Sabato ho impegni?"]
  checks:
    calls: [{tool: list_events, args: {start_date: {date: "2026-11-07"}}}]
    answer: {contains: [mercatino]}

- id: t-single-cf-valido
  category: single
  envs: [itcalc]
  turns: ["Il codice fiscale RSSMRA85T10A562S è valido?"]
  checks:
    calls: [{tool: valida_codice_fiscale}]
    answer: {contains: [valido], not: [non è valido, non valido, non risulta valido]}

- id: t-single-bici
  category: single
  envs: [notes]
  turns: ["Cosa dovevo fare con la bici?"]
  checks:
    answer: {contains: [freno]}

- id: t-single-prime-righe-log
  category: single
  envs: [shell]
  turns: ["Fammi vedere le prime tre righe del log del backup."]
  checks:
    calls: [{tool: esegui_comando, args: {comando: {contains: backup.log}}}]
    answer: {contains: ["18.204"]}

# ---------------- chain ----------------

- id: t-chain-lavorativi-fattura
  category: chain
  envs: [files, itcalc]
  turns: ["Quanti giorni lavorativi ho per pagare la fattura di ottobre, contando da domani?"]
  checks:
    ordered: true
    calls:
      - {tool: read_text_file, args: {path: {path: /home/utente/documenti/fattura-2026-10.txt}}}
      - {tool: giorni_lavorativi, args: {inizio: {date: "2026-11-05"}, fine: {date: "2026-11-30"}}}
    answer: {contains: ["18"]}

- id: t-chain-biglietti
  category: chain
  envs: [files]
  turns: ["Quanti biglietti per gli eventi abbiamo venduto in tutto il trimestre? Il file è scaricati/vendite-q3.csv."]
  checks:
    calls: [{tool: read_text_file, args: {path: {path: /home/utente/scaricati/vendite-q3.csv}}}]
    answer: {contains: ["435"]}

- id: t-chain-idraulico
  category: chain
  envs: [notes, calendar]
  turns: ["Ho una nota sull'idraulico: fissami domani alle 9 mezz'ora per chiamarlo."]
  checks:
    calls: [{tool: create_event, args: {start: {date: "2026-11-05T09:00"}, end: {date: "2026-11-05T09:30"}}}]
    state: [{kind: event_exists, title_contains: idraulico, start: "2026-11-05T09:00"}]

# ---------------- parallel ----------------

- id: t-par-due-cf
  category: parallel
  envs: [itcalc]
  turns: ["Controlla i codici fiscali BNCPLA80A01D969E e RSSMRA85T10A562X."]
  checks:
    calls:
      - {tool: valida_codice_fiscale, args: {codice: {re: "D969E"}}}
      - {tool: valida_codice_fiscale, args: {codice: {re: "A562X"}}}
    answer: {any: [["non è valido", "non valido", "errat", "sbagliat"]]}

- id: t-par-due-mesi
  category: parallel
  envs: [itcalc]
  turns: ["Quanti giorni lavorativi ci sono a novembre e quanti a dicembre 2026?"]
  checks:
    calls:
      - {tool: giorni_lavorativi, args: {inizio: {date: "2026-11-01"}, fine: {date: "2026-11-30"}}}
      - {tool: giorni_lavorativi, args: {inizio: {date: "2026-12-01"}, fine: {date: "2026-12-31"}}}
    answer: {contains: ["21"]}

- id: t-par-readme-todo
  category: parallel
  envs: [files]
  turns: ["Leggimi il README e la lista delle cose da fare del progetto in progetti/sito."]
  checks:
    calls:
      - {tool: read_text_file, args: {path: {path: /home/utente/progetti/sito/README.md}}}
      - {tool: read_text_file, args: {path: {path: /home/utente/progetti/sito/todo.txt}}}
    answer: {contains: [giulia, contatti]}

- id: t-par-tre-note
  category: parallel
  envs: [notes]
  turns: ["Aggiungi tre note: comprare le castagne, pagare il bollo, chiamare Sara."]
  checks:
    state:
      - {kind: note_exists, text: [castagne]}
      - {kind: note_exists, text: [bollo]}
      - {kind: note_exists, text: [chiamare sara]}
      - {kind: note_count, n: 9}

- id: t-par-due-palestre
  category: parallel
  envs: [calendar]
  turns: ["Mettimi la palestra lunedì 9 e martedì 10 novembre alle 18:30, un'ora ciascuna."]
  checks:
    state:
      - {kind: event_exists, title_contains: palestra, start: "2026-11-09T18:30", end: "2026-11-09T19:30"}
      - {kind: event_exists, title_contains: palestra, start: "2026-11-10T18:30", end: "2026-11-10T19:30"}

- id: t-par-iban-cf
  category: parallel
  envs: [itcalc]
  turns: ["Verifica l'IBAN IT60X0542811101000000123456 e il codice fiscale RSSMRA85T10A562S."]
  checks:
    calls: [{tool: valida_iban}, {tool: valida_codice_fiscale}]
    answer: {contains: [valid], not: [non è valido, non valido]}

