# Test split, part 3: multi-turn (3 to 6 turns). Frozen once its SHA-256 is in docs/LEDGER.md.
# Never training data, never a tuning signal. Fixture world, today Wednesday 2026-11-04 10:00.
# Oracles: 244 EUR VAT included at 22% -> 200,00 + 44,00; at 10% -> 221,82 + 22,18;
# rent 780 x 12 = 9.360; 2026-11-04 -> 2026-11-20 is 16 days, 13 working days (12 from tomorrow);
# 5 working days after 2026-11-20 is Friday 2026-11-27; certificate renewal -> 2027-02-02.

- id: t-mt-agenda-weekend
  category: multi
  envs: [calendar]
  turns:
    - {user: "Cosa ho sabato?", checks: {calls: [{tool: list_events, args: {start_date: {date: "2026-11-07"}}}], answer: {contains: [mercatino]}}}
    - {user: "E domenica?", checks: {calls: [{tool: list_events, args: {start_date: {date: "2026-11-08"}}}], answer: {any: [["nessun", "niente", "libero", "non hai", "nulla"]]}}}
    - {user: "Allora domenica mettimi una passeggiata alle 10, per due ore.", checks: {calls: [{tool: create_event, args: {start: {date: "2026-11-08T10:00"}}}]}}
  checks:
    state: [{kind: event_exists, title_contains: passeggiata, start: "2026-11-08T10:00", end: "2026-11-08T12:00"}, {kind: event_count, n: 7}]

- id: t-mt-cert-flow
  category: multi
  envs: [certs]
  turns:
    - {user: "Quali certificati scadono entro un mese?", checks: {calls: [{tool: list_certificates}], answer: {contains: [ilfaro.example, api.studio-levante.example]}}}
    - {user: "Rinnova quello che scade prima.", checks: {calls: [{tool: renew_certificate, args: {domain: ilfaro.example}}], no_call: [{tool: renew_certificate, args: {domain: api.studio-levante.example}}]}}
    - {user: "All'altro attiva il rinnovo automatico.", checks: {calls: [{tool: set_auto_renew, args: {domain: api.studio-levante.example, enabled: true}}]}}
  checks:
    state:
      - {kind: cert_expires, domain: ilfaro.example, date: "2027-02-02"}
      - {kind: cert_expires, domain: api.studio-levante.example, date: "2026-11-25"}
      - {kind: cert_auto_renew, domain: api.studio-levante.example, value: true}

- id: t-mt-git-commit-home
  category: multi
  envs: [git]
  turns:
    - {user: "Che modifiche ci sono nel repo ~/progetti/sito?", checks: {calls_any: [[{tool: git_status}, {tool: git_diff_unstaged}]], answer: {contains: [home.md]}}}
    - {user: "Fai il commit solo della home, messaggio «Aggiorna la home».", checks: {calls: [{tool: git_commit, args: {message: {contains: aggiorna la home}}}]}}
    - {user: "Qual è l'ultimo commit adesso?", checks: {answer: {contains: [aggiorna la home]}}}
  checks:
    state: [{kind: git_committed, message_contains: [aggiorna la home], files: [contenuti/home.md], exclude_files: [immagini/sede-3.jpg]}]

- id: t-mt-palestra-due-volte
  category: multi
  envs: [calendar]
  turns:
    - {user: "Sposta la palestra di giovedì alle 19.", checks: {calls: [{tool: update_event, args: {event_id: ev2}}], no_call: [create_event]}}
    - {user: "Anzi no, alle 20.", checks: {calls: [{tool: update_event, args: {event_id: ev2}}], no_call: [create_event]}}
    - {user: "Perfetto.", checks: {no_tools: true}}
  checks:
    state: [{kind: event_exists, title_contains: palestra, start: "2026-11-05T20:00", end: "2026-11-05T21:00"}, {kind: event_count, n: 6}]

- id: t-mt-foto-ultima
  category: multi
  envs: [files]
  turns:
    - {user: "Cosa c'è nella cartella foto?", checks: {calls: [{tool: list_directory, args: {path: {path: /home/utente/foto}}}]}}
    - {user: "Sposta l'ultimo file dell'elenco nella cartella documenti.", checks: {calls: [{tool: move_file, args: {source: {path: /home/utente/foto/vacanze-cinque-terre-05.jpg}}}]}}
    - {user: "Quanti file restano in foto?", checks: {answer: {any: [["5", "cinque"]]}}}
  checks:
    state: [{kind: file_exists, path: documenti/vacanze-cinque-terre-05.jpg}, {kind: file_absent, path: foto/vacanze-cinque-terre-05.jpg}]

