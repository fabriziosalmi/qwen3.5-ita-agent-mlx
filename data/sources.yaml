# Sources for the synthetic chats without tools (synthetic data generated by the teacher, guided by public
# Hugging Face datasets and benchmarks with clean licenses). License and text origin read from each dataset
# card on 2026-11-03; Italian counts measured on the parquet files that day. The data rules of README.md bind:
# every answer in training data comes from the teacher (Qwen3.5, at most 4B), no NC data, no GPT/Claude/Gemini
# output, no eval item.

seed_prompts:  # questions written by people; the question is kept, the teacher writes the answer
  - id: OpenAssistant/oasst2
    license: apache-2.0
    origin: crowdsourced volunteers
    italian: {user_messages: 316, first_prompts: 140, synthetic: 0}
  - id: CohereLabs/aya_dataset
    license: apache-2.0
    origin: annotators; original-annotations written from scratch, re-annotations are automatic templates
      edited by a person
    italian: {rows: 738, original: 164, re_annotations: 574}
    use: all 738

seed_documents:  # texts written by people, for "riassumi", "spiega in parole semplici", "estrai" requests
  - id: VerbACxSS/ItaIst
    license: mit
    origin: 198 acts of public administrations of 8 regions, collected by the University of Molise
  - id: mii-llm/gazzetta-ufficiale
    license: mit
    origin: official acts of the Italian State

benchmarks:
  eval:  # Italian knowledge checks of the fine-tuned models; never seeds, never training data
    - id: Crisp-Unimib/ITALIC
      license: mit
      origin: 10,000 questions from Italian public exams
    - id: CohereLabs/include-lite-44
      config: Italian
      license: apache-2.0
      origin: exams
  map_only:  # their subjects guide what the teacher covers; their items never appear
    - efederici/pinocchio
    - sapienzanlp/mmlu_italian
    - sapienzanlp/arc_italian
    - sapienzanlp/hellaswag_italian
    - sapienzanlp/gsm8k_italian
    - sapienzanlp/truthful_qa_italian
    - sapienzanlp/winogrande_italian
    - sapienzanlp/boolq_italian
    - CohereLabs/Global-MMLU
    - openai/MMMLU
    - cambridgeltl/xcopa
    - facebook/belebele
  blocklist: "all of the above, plus MMLU-ProX (already an eval of this project): a generated example that
    repeats a span of any of their items is dropped"

excluded:
  - {id: sapienzanlp/dromedario-3-sft-dataset, why: "translated with TranslateGemma-27B from Tülu 3, which holds GPT outputs"}
  - {id: Dddixyy/domande_e_risposte_wikipedia, why: "generated with Gemini"}
  - {id: sapienzanlp/indaqa, why: "questions and answers generated with Gemini"}
  - {id: epfml/FineWeb2-HQ-QA, why: "generated by Qwen3-30B-A3B, above the 4B teacher cap"}
  - {id: PleIAs/SYNTH, why: "generated by models the card does not name"}
  - {id: jacopof/lumina-italian-distilled-qa, why: "distilled from a model the card does not name"}
  - {id: DeepMount00/OpenItalianData, why: "empty card, origin unknown"}
  - {id: mii-community/UsenetArchiveIT-conversations, why: "posts of real people with their names; the license was set by the uploader, not the authors"}
  - {id: wikimedia/wikipedia (it), why: "CC BY-SA share-alike; left out"}
  - {id: "Italian instruction sets translated or generated with ChatGPT", why: "may carry GPT output; not checked one by one"}
